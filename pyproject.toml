[project]
name = "pedidosweb"
version = "0.1.0"
description = "Sistema de carga de pedidos"
authors = [
    {name = "Gregory Rodriguez",email = "glrd4726@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow (>=12.3.0,<13.0.0)"

]

[tool.poetry]
packages = [{include = "pedidosweb", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
